name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Runs last because it is the slowest step, so a type error or a
      # failing test reports in under a minute instead of after a full
      # Next build.
      #
      # The Supabase vars are placeholders, not secrets. The build only
      # needs them to be PRESENT — one page fetches live plan prices at
      # build time and falls back when that fails, which is the path
      # exercised here. No real credential belongs in CI for this.
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

      # Route-level smoke tests — OPEN_ITEMS item 0.
      #
      # Reuses the .next produced by the step above rather than
      # rebuilding, so this costs the request time and nothing more.
      #
      # Runs in STRUCTURAL mode: no SMOKE_REAL_DB, so database-backed
      # routes are checked for a response rather than for correctness,
      # and the run says so in its output. Full coverage needs a real
      # project and a session cookie; the suite prints exactly what is
      # uncovered rather than letting a green tick imply more than it
      # means.
      - name: Route smoke tests
        run: npm run test:smoke:only
        env:
          # Points at the dedicated CI Supabase project when the
          # secrets are set, and falls back to placeholders when they
          # are not — so a fork or a clone still gets parts 1 and 3
          # rather than a red suite it cannot fix.
          #
          # SMOKE_* names deliberately differ from the production
          # variable names. Nothing here should ever be able to reach
          # the production project by a copy-paste accident.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          # Without a real service role key, 14 routes that call
          # createServiceClient() throw at client construction and 500
          # regardless of how good the database is. Supplying it is what
          # takes the run from 346/360 to full coverage.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          # Full mode: the CI project has a real schema, so a 500 from
          # a database-backed route is a genuine defect, not a missing
          # database. This is what makes the run assert on all 355
          # routes rather than exempting 14.
          # Full mode needs BOTH a real project and a service role key —
          # without the latter those 14 routes cannot pass, and asserting
          # strictly would fail the suite for a missing secret rather than
          # a defect.
          SMOKE_REAL_DB: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY && '1' || '' }}
